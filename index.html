<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Wish Files</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* One visual world: a night sled run. Each chapter floods the screen with its own color,
   and a sled rides the hill at the bottom as the kid moves through the file. */
:root{
  --ink:#14123A; --snow:#FFFDF7; --sun:#FFC629; --mint:#27E0B0; --flare:#FF4F6D;
  --cobalt:#2B35E8; --berry:#B81D62; --spruce:#0A6E60; --ember:#C2410C;
  --paper:#F3F4FF; --line:#CBD0F2; --muted:#4D4C75;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --body:"Lexend","Trebuchet MS",system-ui,sans-serif;
  --bg:var(--cobalt);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--snow);font:400 17px/1.45 var(--body);transition:background .5s;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.08;text-wrap:balance;overflow-wrap:anywhere}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
#root{position:relative;z-index:2;height:100%}
.hidden{display:none!important}

/* Kid frame */
.frame{height:100%;display:grid;grid-template-rows:auto 1fr auto auto}
.top{display:flex;align-items:center;gap:6px;padding:12px 16px 8px;max-width:680px;width:100%;margin:0 auto}
.chips{display:flex;gap:6px;flex:1;min-width:0}
.chapchip{flex:1;min-width:0;background:rgba(255,253,247,.16);border:0;border-radius:8px;padding:0;height:34px;color:var(--snow);font-size:12px;font-weight:600;position:relative;overflow:hidden}
.chapchip i{position:absolute;left:0;bottom:0;height:5px;background:var(--sun);transition:width .5s}
.chapchip span{position:relative;display:block;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chapchip.on{box-shadow:inset 0 0 0 2px var(--snow)}
.status{font-size:12px;font-weight:600;min-width:52px;text-align:right;opacity:.92}
.status.err{color:var(--sun)}
#stage{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.pane{max-width:680px;margin:0 auto;padding:10px 16px 24px;display:flex;flex-direction:column;gap:16px}
.pane.in{animation:paneIn .34s cubic-bezier(.2,.9,.3,1.2)}
.pane.back{animation:paneBack .3s ease-out}
@keyframes paneIn{from{transform:translateX(44px);opacity:.2}to{transform:none;opacity:1}}
@keyframes paneBack{from{transform:translateX(-44px);opacity:.2}to{transform:none;opacity:1}}
.pane h2{font-size:clamp(32px,9vw,46px)}
.sub{margin:-8px 0 0;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-weight:600;font-size:16px}
.in-box{width:100%;min-height:52px;border:3px solid var(--ink);border-radius:12px;background:var(--snow);padding:11px 13px;font-size:18px;box-shadow:0 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.in-box:focus{outline:none;transform:translateY(-2px);box-shadow:0 6px 0 var(--sun)}
textarea.in-box{min-height:92px;resize:vertical}
.in-box::placeholder{color:#7a7898}
.tiles{display:flex;flex-wrap:wrap;gap:9px}
.tile{min-height:48px;padding:9px 15px;border:3px solid var(--ink);border-radius:999px;background:var(--snow);font-weight:600;font-size:16px;transition:transform .16s cubic-bezier(.3,1.8,.5,1),background .12s}
.tile:nth-child(3n+1).sel{transform:rotate(-3deg) scale(1.05)}
.tile:nth-child(3n+2).sel{transform:rotate(2deg) scale(1.05)}
.tile:nth-child(3n).sel{transform:rotate(-1deg) scale(1.05)}
.tile.sel{background:var(--sun);box-shadow:0 4px 0 var(--ink)}

/* Colors */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{min-height:50px;border:3px solid var(--ink);border-radius:12px;background:rgba(255,253,247,.25);color:var(--snow);font-weight:800;font-size:15px}
.mode.on{background:var(--snow);color:var(--ink)}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
.sw{background:none;border:0;padding:0;color:var(--snow);font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px}
.sw b{position:relative;display:grid;place-items:center;width:62px;height:62px;border-radius:50%;border:3px solid var(--ink);font:400 22px var(--display);color:var(--ink);transition:transform .18s cubic-bezier(.3,1.8,.5,1)}
.sw em{font-style:normal;background:var(--snow);border:2px solid var(--ink);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;line-height:1}
.sw.picked b{transform:scale(1.14) rotate(-6deg)}

/* Have / want */
.haves{display:flex;flex-direction:column;gap:10px}
.have{background:rgba(255,253,247,.14);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.have strong{font-weight:600}
.have button{min-height:46px;min-width:68px;border:3px solid var(--ink);border-radius:10px;background:var(--snow);font-weight:800;font-size:15px}
.have button.has{background:var(--mint)}
.have button.want{background:var(--sun)}
.have input{grid-column:1/-1;min-height:46px;font-size:16px}

/* This or that */
.tts{display:flex;flex-direction:column;gap:12px}
.tt{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.tt span{font:400 15px var(--display)}
.tt button{min-height:62px;border:3px solid var(--ink);border-radius:14px;background:var(--snow);font-weight:800;font-size:16px;padding:6px;transition:transform .18s cubic-bezier(.3,1.8,.5,1)}
.tt button.sel{background:var(--sun);transform:scale(1.05) rotate(-1.5deg);box-shadow:0 4px 0 var(--ink)}

/* Wishes */
.wishlist{display:flex;flex-direction:column;gap:18px}
.wish{display:grid;grid-template-columns:minmax(50px,auto) 1fr;gap:6px 10px}
.wish.extra{animation:paneIn .34s cubic-bezier(.2,.9,.3,1.2)}
.wish .num{font:400 52px/1 var(--display);color:var(--sun);grid-row:span 2}
.wish .field{grid-column:2}

/* Drawing */
.pad{background:#fff;border:3px solid var(--ink);border-radius:14px;touch-action:none;width:100%;aspect-ratio:4/3;display:block}
.pens{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pen{width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);padding:0}
.pen.on{box-shadow:0 0 0 3px var(--snow)}
.tool{min-height:44px;padding:0 14px;border:3px solid var(--ink);border-radius:10px;background:var(--snow);font-weight:800;font-size:15px}
.tool.on{background:var(--sun)}

/* Footer and hill */
.foot{display:flex;gap:10px;max-width:680px;width:100%;margin:0 auto;padding:8px 16px}
.btn{min-height:56px;border:3px solid var(--ink);border-radius:14px;background:var(--snow);font:400 19px var(--display);padding:0 18px;box-shadow:0 4px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn.go{flex:1;background:var(--sun)}
.btn:disabled{opacity:.6}
.hill{position:relative;height:80px;overflow:hidden}
.hill svg.land{position:absolute;inset:0;width:100%;height:100%}
#sled{position:absolute;left:0;bottom:0;width:54px;height:41px;transform-origin:50% 100%;transition:left .7s cubic-bezier(.4,.1,.3,1),bottom .7s cubic-bezier(.4,.1,.3,1),transform .7s}
#sled svg{display:block;width:100%;height:100%;animation:bob 1.3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px) rotate(-1deg)}}
.flag{position:absolute;width:20px;height:28px;transform-origin:0 100%;animation:plant .4s cubic-bezier(.3,1.8,.5,1)}
@keyframes plant{from{transform:scaleY(0)}to{transform:none}}
@media (max-height:520px){.hill{display:none}}

/* Chapter wipe */
#wipe{position:fixed;inset:0;z-index:5;display:none;place-items:center;text-align:center;padding:24px;color:var(--snow)}
#wipe.run{display:grid;animation:wipe 1.25s cubic-bezier(.7,0,.3,1) forwards}
#wipe h2{font-size:clamp(46px,14vw,92px)}
#wipe p{margin:0 0 6px;font-weight:800;font-size:18px}
#wipe svg{width:92px;height:92px;margin-top:14px;animation:stamp .45s .3s cubic-bezier(.3,1.9,.5,1) backwards}
@keyframes wipe{0%{transform:translateY(100%)}26%,74%{transform:none}100%{transform:translateY(-100%)}}
@keyframes stamp{from{transform:scale(3) rotate(30deg);opacity:0}}

/* Welcome */
.welcome{height:100%;overflow-y:auto}
.welcome .inner{max-width:520px;margin:0 auto;padding:clamp(24px,8vh,70px) 20px 96px;display:flex;flex-direction:column;gap:16px}
.logo{font:400 clamp(64px,21vw,112px)/.92 var(--display);margin:0}
.logo span{display:inline-block;animation:drop .6s cubic-bezier(.3,1.5,.5,1) backwards}
.logo .w1{color:var(--snow)} .logo .w2{color:var(--sun)} .logo .w3{color:var(--mint)}
@keyframes drop{from{transform:translateY(-120px) rotate(-14deg);opacity:0}}
.lead{font-size:19px;font-weight:600;margin:0}
.note{background:var(--snow);color:var(--ink);border-radius:12px;padding:10px 13px;font-size:15px;font-weight:600}
.err{background:var(--sun);color:var(--ink);border-radius:12px;padding:10px 13px;font-weight:600;font-size:16px}
.link{background:none;border:0;color:var(--snow);text-decoration:underline;font-weight:600;padding:10px 0;font-size:16px;align-self:flex-start;min-height:44px}
.hill.fixed{position:fixed;left:0;right:0;bottom:0;z-index:-1}

/* Grown-up board: same family, calmer, built for reading */
body.adult{background:var(--paper);color:var(--ink);overflow:hidden}
body.adult #fx{display:none}
.board{height:100%;overflow-y:auto}
.bar{position:sticky;top:0;z-index:3;background:var(--cobalt);color:var(--snow);padding:12px 16px}
.bar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.bar h1{font-size:22px;flex:1;min-width:0}
.ghost{min-height:44px;padding:0 13px;border:2px solid var(--snow);border-radius:10px;background:none;color:var(--snow);font-weight:600;font-size:15px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 60px;display:flex;flex-direction:column;gap:14px}
.kidrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%;min-height:72px}
.dot{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);display:block}
.kidrow strong{font-family:var(--display);font-weight:400;font-size:21px;display:block;line-height:1.15}
.kidrow small{font-size:14px;color:var(--muted)}
.pill{font-size:13px;font-weight:800;padding:4px 10px;border-radius:999px;background:#E3E5FA;white-space:nowrap}
.pill.done{background:var(--mint)}
.hero{display:flex;gap:14px;align-items:center}
.hero h2{font-size:36px}
.hero p{margin:2px 0 0;color:var(--muted)}
.sec{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.sec h3{font-size:19px;color:var(--cobalt)}
.sec.stop{border-color:var(--flare)} .sec.stop h3{color:#B3173A}
.kv{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:10px;border-top:1px solid #E7E9FA;padding-top:8px;font-size:16px}
.kv:first-of-type{border-top:0;padding-top:0}
.kv span{color:var(--muted)}
.kv div{overflow-wrap:anywhere;font-weight:600}
.gift{display:flex;flex-direction:column;gap:6px;border-top:1px solid #E7E9FA;padding-top:10px}
.gift:first-of-type{border-top:0;padding-top:0}
.gift .t{font-weight:800;font-size:18px;overflow-wrap:anywhere}
.gift .d{color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.dib{align-self:flex-start;min-height:44px;padding:0 14px;border:2px solid var(--ink);border-radius:10px;background:var(--sun);font-weight:800;font-size:15px}
.dib.taken{background:#E3E5FA;border-color:transparent;cursor:default}
.dib.mine{background:var(--mint)}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;min-height:46px;border:2px solid var(--ink);border-radius:10px;padding:8px 11px;font-size:16px}
.row button,.savebtn{min-height:46px;padding:0 14px;border:2px solid var(--ink);border-radius:10px;background:var(--sun);font-weight:800;font-size:15px}
.chiplist{display:flex;flex-wrap:wrap;gap:6px}
.chiplist b{font-weight:600;font-size:14px;background:#E3E5FA;border-radius:999px;padding:4px 10px}
.colors{display:flex;gap:16px;flex-wrap:wrap}
.colors div{display:flex;gap:7px;align-items:center;font-size:15px}
.colors i{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:block}
.draw{width:100%;max-width:420px;border:2px solid var(--line);border-radius:12px}
.adultfield{display:flex;flex-direction:column;gap:5px}
.adultfield label{font-weight:600;font-size:15px}
.adultfield textarea{border:2px solid var(--line);border-radius:10px;padding:9px;min-height:60px;font-size:16px;resize:vertical}
.savemsg{font-size:14px;font-weight:600;color:var(--muted)}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
@media (min-width:600px){.swatches{grid-template-columns:repeat(6,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
